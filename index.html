<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <!-- Primary -->
    <title>KrynoluxDC — News by Kids. For the Community.</title>
    <meta name="description" content="Youth-led news from Fairfax, Loudoun, and Washington DC. Local news, schools, sports, and community stories." />
    <meta name="theme-color" content="#7B2FFF" />

    <!-- PWA / Manifest -->
    <link rel="manifest" href="/manifest.json" />

    <!-- Standard favicon -->
    <link rel="icon" type="image/png" href="/favicon.png" />

    <!-- Apple "Add to Home Screen" -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="KrynoluxDC" />
    <link rel="apple-touch-icon" href="/logo-circle.png" />
    <link rel="apple-touch-icon" sizes="120x120" href="/logo-circle.png" />
    <link rel="apple-touch-icon" sizes="152x152" href="/logo-circle.png" />
    <link rel="apple-touch-icon" sizes="167x167" href="/logo-circle.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/logo-circle.png" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://krynolux.work" />
    <meta property="og:title" content="KrynoluxDC — News by Kids. For the Community." />
    <meta property="og:description" content="Youth-led news from Fairfax, Loudoun, and Washington DC." />
    <meta property="og:image" content="https://krynolux.work/logo-circle.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="KrynoluxDC" />
    <meta name="twitter:description" content="Youth-led news from Fairfax, Loudoun, and Washington DC." />
    <meta name="twitter:image" content="https://krynolux.work/logo-circle.png" />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;800&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
